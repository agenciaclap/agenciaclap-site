<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVP — Agência CLAP (teste isolado)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 480px; margin: 40px auto; padding: 0 20px; color: #1a1a1a;
  }
  h1 { font-size: 1.3rem; }
  h2 { font-size: 1rem; margin-top: 40px; border-top: 1px solid #ddd; padding-top: 24px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 1rem; border: 2px solid #ccc;
    border-radius: 8px; margin-top: 8px;
  }
  button {
    width: 100%; padding: 14px; font-size: 1rem; font-weight: 700; color: #fff;
    background: #1a1a1a; border: none; border-radius: 8px; margin-top: 12px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #igResult, #mpResult { margin-top: 16px; padding: 14px; border-radius: 8px; background: #f5f5f5; }
  #igResult img { width: 64px; height: 64px; border-radius: 50%; float: left; margin-right: 12px; object-fit: cover; }
  #igResult .name { font-weight: 700; }
  #igResult .user { color: #666; font-size: .9rem; }
  #mpResult img { width: 220px; display: block; margin: 0 auto 12px; }
  #mpCopyCode {
    width: 100%; padding: 10px; font-size: .8rem; word-break: break-all;
    border: 1px solid #ccc; border-radius: 6px; background: #fff;
  }
  .status { font-size: .85rem; color: #666; margin-top: 8px; }
  .error { color: #b00020; font-weight: 600; }
</style>
</head>
<body>

<h1>MVP isolado — Agência CLAP</h1>
<p style="color:#666;font-size:.9rem;">Só duas coisas: busca de Instagram (HikerAPI) e geração de PIX (Mercado Pago). Nada de layout, admin, carrinho ou e-mail.</p>

<h2>1) Busca de Instagram</h2>
<input type="text" id="igInput" placeholder="@instagram" autocomplete="off">
<div id="igStatus" class="status"></div>
<div id="igResult" style="display:none;"></div>

<h2>2) Checkout (PIX de R$ 1,00)</h2>
<button id="pixBtn">Gerar PIX</button>
<div id="mpStatus" class="status"></div>
<div id="mpResult" style="display:none;"></div>

<script>
/* ---------- 1) Busca de Instagram ---------- */
const igInput = document.getElementById('igInput');
const igStatus = document.getElementById('igStatus');
const igResult = document.getElementById('igResult');
let debounceTimer = null;
let requestId = 0;

igInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  igResult.style.display = 'none';
  igStatus.textContent = '';

  const username = igInput.value.trim().replace(/^@/, '');
  if (username.length < 2) return;

  debounceTimer = setTimeout(async () => {
    const myRequestId = ++requestId;
    igStatus.textContent = 'Buscando perfil...';
    igStatus.className = 'status';

    try {
      const res = await fetch(`/api/instagram/lookup?username=${encodeURIComponent(username)}`);
      if (myRequestId !== requestId) return;

      if (res.status === 404) {
        igStatus.textContent = 'Perfil não encontrado.';
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        console.error('[MVP] erro na busca de Instagram:', body);
        igStatus.textContent = `Erro (HTTP ${res.status}): ${body.error || 'falha desconhecida'}`;
        igStatus.className = 'status error';
        return;
      }

      const profile = await res.json().catch((parseErr) => {
        console.error('[MVP] resposta não-JSON na busca de Instagram:', parseErr);
        return null;
      });
      if (!profile) {
        igStatus.textContent = 'Servidor respondeu algo inesperado (não é JSON). Tente novamente.';
        igStatus.className = 'status error';
        return;
      }
      igStatus.textContent = '';
      igResult.style.display = 'block';
      igResult.innerHTML = `
        <img src="${profile.profilePictureUrl || 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(profile.username)}" alt="">
        <div class="name">${profile.name || '@' + profile.username}</div>
        <div class="user">@${profile.username}</div>
      `;
    } catch (err) {
      if (myRequestId !== requestId) return;
      console.error('[MVP] exceção na busca de Instagram:', err);
      igStatus.textContent = 'Falha de conexão ao buscar o perfil.';
      igStatus.className = 'status error';
    }
  }, 400);
});

/* ---------- 2) Checkout PIX ---------- */
const pixBtn = document.getElementById('pixBtn');
const mpStatus = document.getElementById('mpStatus');
const mpResult = document.getElementById('mpResult');

pixBtn.addEventListener('click', async () => {
  pixBtn.disabled = true;
  mpResult.style.display = 'none';
  mpStatus.textContent = 'Gerando PIX...';
  mpStatus.className = 'status';

  try {
    const res = await fetch('/api/mercadopago/create-payment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: 'teste@agenciaclap.com.br' })
    });

    const rawText = await res.text();
    let body;
    try {
      body = JSON.parse(rawText);
    } catch (parseErr) {
      // O servidor respondeu algo que não é JSON — normalmente uma página de
      // erro de infraestrutura (ex: gateway timeout do Render durante o
      // "cold start" do plano grátis), não um erro da nossa aplicação.
      console.error('[MVP] resposta não-JSON do servidor:', rawText.slice(0, 300));
      mpStatus.textContent = `Servidor respondeu algo inesperado (HTTP ${res.status}, não é JSON). Se o serviço acabou de subir, aguarde alguns segundos e tente de novo.`;
      mpStatus.className = 'status error';
      pixBtn.disabled = false;
      return;
    }

    if (!res.ok) {
      console.error('[MVP] erro ao criar pagamento:', body);
      mpStatus.textContent = `Erro (HTTP ${res.status}): ${body.error || 'falha desconhecida'}`;
      mpStatus.className = 'status error';
      pixBtn.disabled = false;
      return;
    }

    mpStatus.textContent = `Pagamento criado — ID ${body.id}, status: ${body.status}`;
    mpResult.style.display = 'block';
    mpResult.innerHTML = `
      ${body.qr_code_base64 ? `<img src="data:image/png;base64,${body.qr_code_base64}" alt="QR Code PIX">` : '<p class="error">QR Code não veio na resposta.</p>'}
      <label style="font-size:.8rem;color:#666;">Copia e Cola:</label>
      <input type="text" id="mpCopyCode" value="${body.qr_code || ''}" readonly onclick="this.select()">
    `;

    // Polling de status — fecha o fluxo até "Pagamento aprovado".
    pollPaymentStatus(body.id);
  } catch (err) {
    console.error('[MVP] exceção ao criar pagamento:', err);
    mpStatus.textContent = 'Falha de conexão ao criar o pagamento.';
    mpStatus.className = 'status error';
  } finally {
    pixBtn.disabled = false;
  }
});

function pollPaymentStatus(paymentId){
  const intervalId = setInterval(async () => {
    try {
      const res = await fetch(`/api/mercadopago/payment-status/${paymentId}`);
      if (!res.ok) return; // tenta de novo no próximo ciclo
      const body = await res.json().catch(() => null);
      if (!body) return; // resposta não-JSON isolada, tenta de novo no próximo ciclo

      if (body.status === 'approved') {
        clearInterval(intervalId);
        mpResult.innerHTML = `
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:2.5rem;">✅</div>
            <p style="font-weight:700;font-size:1.1rem;margin-top:8px;">Pagamento aprovado!</p>
          </div>
        `;
        mpStatus.textContent = '';
      } else if (['cancelled', 'rejected'].includes(body.status)) {
        clearInterval(intervalId);
        mpStatus.textContent = `Pagamento ${body.status === 'rejected' ? 'rejeitado' : 'cancelado'}.`;
        mpStatus.className = 'status error';
      }
      // "pending" -> continua o polling normalmente
    } catch (err) {
      console.error('[MVP] erro no polling de status:', err);
      // não para o polling por causa de uma falha isolada de rede
    }
  }, 3000);

  // Não fica pra sempre: para depois de 5 minutos se ninguém pagar.
  setTimeout(() => clearInterval(intervalId), 5 * 60 * 1000);
}
</script>

</body>
</html>
